name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      # 4. Allocate JVM Memory for Gradle & KSP (Fixes OutOfMemory Metaspace)
      - name: Configure Gradle & Kotlin Memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties

      # 5. Install dependencies
      - name: Install dependencies
        run: npm install

      # 6. Generate Native Android Project
      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      # 7. Compile the APK using Gradle
      - name: Build Android APK
        working-directory: my-app/android
        run: ./gradlew assembleRelease --no-daemon

      # 8. Upload the APK to GitHub Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArrowPuzzle-APK
          path: my-app/android/app/build/outputs/apk/**/*.apk