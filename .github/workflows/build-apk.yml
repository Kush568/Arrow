name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    permissions:
      contents: write # Gives permission to create/update Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Configure Gradle & Kotlin Memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties

      - name: Install dependencies
        run: npm install

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        working-directory: my-app/android
        run: ./gradlew assembleRelease --no-daemon

      # Automatically publish / update GitHub Release
      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0" # or "latest"
          name: "Arrow Puzzle - Latest APK Build"
          body: "Automatic build of the latest Arrow Puzzle standalone Android APK."
          draft: false
          prerelease: false
          files: my-app/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}